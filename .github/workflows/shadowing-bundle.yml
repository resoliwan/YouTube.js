name: Publish youtubejs.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadowing-bundle
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'resoliwan/YouTube.js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test shadowing/runtime.node-test.mjs
      - run: node dev-scripts/build-shadowing-bundle.mjs
      - name: Publish browser download mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          mirror="$RUNNER_TEMP/youtubejs-bundles"
          gh auth setup-git
          git init "$mirror"
          git -C "$mirror" remote add origin "https://github.com/${GH_REPO}.git"
          if git -C "$mirror" fetch --depth 1 origin bundles; then
            git -C "$mirror" checkout -B bundles FETCH_HEAD
          else
            git -C "$mirror" checkout --orphan bundles
          fi
          mkdir -p "$mirror/$version"
          cp build/shadowing/youtubejs.zip "$mirror/$version/youtubejs.zip"
          git -C "$mirror" config user.name github-actions\[bot\]
          git -C "$mirror" config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git -C "$mirror" add "$version/youtubejs.zip"
          if ! git -C "$mirror" diff --cached --quiet; then
            git -C "$mirror" commit -m "Publish youtubejs.zip ${version} from ${GITHUB_SHA}"
            git -C "$mirror" push origin HEAD:bundles
          fi
      - name: Publish using the existing package version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "YouTube.js ${version} for Shadowing. The source commit and file hashes are recorded in manifest.json inside youtubejs.zip."
          fi
          gh release upload "$tag" build/shadowing/youtubejs.zip --clobber
          gh release edit "$tag" --latest
